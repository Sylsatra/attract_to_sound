[[mixins]]
  type = "CONFIG"
  config = "soundattract.hotbath.mixins.json"
[[mixins]]
  type = "CONFIG"
  config = "soundattract.taczhostiles.mixins.json"
[[mods]]
modId="${mod_id}" 
version="${mod_version}" 
logoFile="attract-to-sound-mod-logo.jpg"
displayName="${mod_name}" 
authors="${mod_authors}" 
description='''
A mod to make mobs lured into sound.
Also camouflage is a thing.
'''
