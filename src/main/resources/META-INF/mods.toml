modLoader="javafml" 
loaderVersion="${loader_version_range}"
license="${mod_license}"
[[mixins]]
  type = "CONFIG"
  config = "soundattract.mixins.json"
[[mixins]]
  type = "CONFIG"
  config = "soundattract.customnpcs.mixins.json"
[[mixins]]
  type = "CONFIG"
  config = "soundattract.pointblank.mixins.json"
[[mixins]]
  type = "CONFIG"
  config = "soundattract.tacznpcs.mixins.json"
[[mixins]]
