plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.38'
}

version = project.property('mod_version')
group = project.property('mod_group_id')

mixin {
    add sourceSets.main, "soundattract.refmap.json"
    config "soundattract.mixins.json"
    config "soundattract.taczhostiles.mixins.json"
    defaultObfuscationEnv = "searge"
    debug.verbose     = true
    debug.export      = true
    dumpTargetOnFailure = true
}

// Keep Caffeine as its own Forge Jar-in-Jar module. Expanding its classes into
// this mod's module creates a split-package conflict when another mod also
// exposes Caffeine (for example, Apoli).
jarJar.enable()

base {
    archivesName = "forge_${project.property('mod_id')}_${project.property('minecraft_version')}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: project.property('mapping_channel'), version: project.property('mapping_version')
    copyIdeResources = true
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            property "mixin.config", "soundattract.mixins.json,soundattract.customnpcs.mixins.json,soundattract.tacznpcs.mixins.json,soundattract.mixins.gecko.json,soundattract.hotbath.mixins.json"
            mods {
                "${project.property('mod_id')}" {
                    source sourceSets.main
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', project.property('mod_id')
            property "mixin.config", "soundattract.mixins.json,soundattract.customnpcs.mixins.json,soundattract.tacznpcs.mixins.json,soundattract.mixins.gecko.json,soundattract.hotbath.mixins.json"
            jvmArgs += [
        "-Dmixin.env.remapRefMap=true",
        "-Dmixin.debug.verbose=true",
        "-Dmixin.debug.export=true",
        "-Dmixin.debug.verify=true",
        "-Dmixin.debug.countInjections=true",
        "-Dmixin.checks=true",
        "-Dmixin.dumpTargetOnFailure=true"
                    ] 
        }
        server {
            property 'forge.enabledGameTestNamespaces', project.property('mod_id')
            property "mixin.config", "soundattract.mixins.json,soundattract.customnpcs.mixins.json,soundattract.tacznpcs.mixins.json,soundattract.mixins.gecko.json,soundattract.hotbath.mixins.json"
            args '--nogui'
            jvmArgs += [
        "-Dmixin.env.remapRefMap=true",
        "-Dmixin.debug.verbose=true",
        "-Dmixin.debug.export=true",
        "-Dmixin.debug.verify=true",
        "-Dmixin.debug.countInjections=true",
        "-Dmixin.checks=true",
        "-Dmixin.dumpTargetOnFailure=true"
                    ]        
                }
        gameTestServer {
            property 'forge.enabledGameTestNamespaces', project.property('mod_id')
            if (project.hasProperty('livingBridgeGameTestDirectory')) {
                workingDirectory project.file(project.property('livingBridgeGameTestDirectory'))
            }
            mods {
                "${project.property('mod_id')}" {
                    source sourceSets.main
                    source sourceSets.test
                }
            }
        }
        data { 
            workingDirectory project.file('run-data')
            args '--mod', project.property('mod_id'), '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}
sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.processResources { 
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

repositories {
    maven { name = 'SpongePowered'; url = 'https://repo.spongepowered.org/maven/' }
    mavenCentral()
    maven { name = "henkelmax.public"; url = 'https://maven.maxhenkel.de/repository/public' }
    maven { name = "Modrinth"; url = "https://api.modrinth.com/maven"; content { includeGroup "maven.modrinth" } }
    mavenLocal()
    maven { name = "Curse Maven"; url = "https://www.cursemaven.com"; content { includeGroup "curse.maven" } }
    maven {
        name = "plasmoverse-releases"
        url = "https://repo.plasmoverse.com/releases"
    }
    flatDir {
        dirs 'libs', 'mods/weather2/libs'
    }
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
}

dependencies {
    def quantifiedApiJar = file('mods/quantified-api-omni-2.2.0.jar').exists()
            ? file('mods/quantified-api-omni-2.2.0.jar')
            : file('libs/quantified api-omni-2.2.0.jar')
        minecraft "net.minecraftforge:forge:${project.property('minecraft_version')}-${project.property('forge_version')}"
    compileOnly "de.maxhenkel.voicechat:voicechat-api:2.5.27"
    runtimeOnly fg.deobf("maven.modrinth:simple-voice-chat:forge-1.20.1-2.5.27")
    annotationProcessor "org.spongepowered:mixin:0.8.5:processor"
    compileOnly "curse.maven:timeless-and-classics-zero-1028108:6654541"
    compileOnly "curse.maven:vics-point-blank-961053:6012485"
    compileOnly files('libs/enhancedai-3.3.6.jar')
    compileOnly files('libs/insanelib-1.21.21.jar')
    compileOnly "su.plo.voice.api:server:2.1.5"
    compileOnly "su.plo.voice.api:client:2.1.5"
    compileOnly "maven.modrinth:smartbrainlib:1.15"
    compileOnly files(quantifiedApiJar)
    compileOnly fg.deobf('local.weather2:weather2-1.20.1:2.8.3')
    compileOnly fg.deobf('local.coroutil:coroutil-forge-1.20.1:1.3.7')
    compileOnly files('libs/relentlessundead-1.20.1-0.0.2-ALPHA.jar')
    compileOnly files('libs/spore_2.2.0_1.20.1.jar')
    compileOnly files('libs/hotbath-1.20.1-4.0.0.jar')
    compileOnly files('libs/ToughAsNails-forge-1.20.1-9.2.0.171.jar')
    compileOnly files('libs/tacz_hostiles-1.1.1.jar')
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-1.20.1:4.4.2")
    implementation("com.eliotlash.mclib:mclib:20")
    implementation("com.github.ben-manes.caffeine:caffeine:3.1.8")
    minecraftLibrary("com.github.ben-manes.caffeine:caffeine:3.1.8")
    jarJar(group: 'com.github.ben-manes.caffeine', name: 'caffeine', version: '[3.1.8,4.0)') {
        jarJar.pin(it, '3.1.8')
    }
    testImplementation("org.junit.jupiter:junit-jupiter:5.10.2")
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: project.property('minecraft_version'),
            minecraft_version_range: project.property('minecraft_version_range'),
            forge_version: project.property('forge_version'),
            forge_version_range: project.property('forge_version_range'),
            loader_version_range: project.property('loader_version_range'),
            voicechat_dependency: project.property('voicechat_dependency'),
            mod_id: project.property('mod_id'),
            mod_name: project.property('mod_name'),
            mod_license: project.property('mod_license'),
            mod_version: project.property('mod_version'),
            mod_authors: project.property('mod_authors'),
            mod_description: project.property('mod_description')
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.register('syncGameTestStructuresToRun', Copy) {
    from('src/test/resources/gameteststructures') {
        include '*.snbt'
    }
    if (project.hasProperty('livingBridgeGameTestDirectory')) {
        def isolatedRoot = file(project.property('livingBridgeGameTestDirectory'))
        def repoRoot = project.projectDir.canonicalFile.toPath()
        def isolatedPath = isolatedRoot.canonicalFile.toPath()
        if (!new File(project.property('livingBridgeGameTestDirectory').toString()).isAbsolute()
                || isolatedPath.startsWith(repoRoot)
                || isolatedPath.startsWith(repoRoot.resolve('run'))) {
            throw new GradleException('livingBridgeGameTestDirectory must be absolute and outside the repository and run directory')
        }
        into new File(isolatedRoot, 'gameteststructures')
    } else {
        into layout.projectDirectory.dir('run/gameteststructures')
    }
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn tasks.named('syncGameTestStructuresToRun')
    if (project.hasProperty('livingBridgeGameTestDirectory')) {
        def isolatedRoot = file(project.property('livingBridgeGameTestDirectory'))
        def repoRoot = project.projectDir.canonicalFile.toPath()
        def isolatedPath = isolatedRoot.canonicalFile.toPath()
        if (!new File(project.property('livingBridgeGameTestDirectory').toString()).isAbsolute()
                || isolatedPath.startsWith(repoRoot)
                || isolatedPath.startsWith(repoRoot.resolve('run'))) {
            throw new GradleException('livingBridgeGameTestDirectory must be absolute and outside the repository and run directory')
        }
    }
    if (project.hasProperty('livingBridgeFixture')) {
        jvmArgs "-DlivingBridgeFixture=${project.property('livingBridgeFixture')}"
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : project.property('mod_id'),
                'Specification-Vendor'    : project.property('mod_authors'),
                'Specification-Version'   : project.property('mod_version'),
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.property('mod_version'), 
                'Implementation-Vendor'   : project.property('mod_authors'),
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : "soundattract.mixins.json,soundattract.customnpcs.mixins.json,soundattract.tacznpcs.mixins.json,soundattract.mixins.gecko.json,soundattract.hotbath.mixins.json"
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact tasks.named('jarJar')
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
