plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

loom {
	accessWidenerPath = file("src/main/resources/soundattract.accesswidener")
}

version = project.mod_version
group = project.maven_group

repositories {
    maven {
        name = 'Ladysnake Mods'
        url = 'https://maven.ladysnake.org/releases'
    }
    maven {
        name = "Fuzs Mod Resources"
        url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
    }
    maven {
        name = "plasmoverse-releases"
        url = "https://repo.plasmoverse.com/releases"
    }
    flatDir {
        dirs 'libs'
    }
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
                includeGroupByRegex("software\\.bernie.*")
                includeGroup("com.eliotlash.mclib")
        }
    }

    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://api.modrinth.com/maven" }
    maven { url = "https://maven.maxhenkel.de/repository/public" }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modCompileOnly "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"
    modRuntimeOnly "maven.modrinth:simple-voice-chat:fabric-${voicechat_version}"
    modCompileOnly "su.plo.voice.api:server:2.1.5"
    modCompileOnly "su.plo.voice.api:client:2.1.5"
    modImplementation files('libs/pointblank-fabric-1.20.1-1.11.1.jar')
    modImplementation files('libs/geckolib-fabric-1.20.1-4.8.3.jar')
	implementation("com.eliotlash.mclib:mclib:20")
	modImplementation files('libs/ForgeConfigAPIPort-v8.0.3-1.20.1-Fabric.jar')
	modImplementation files('libs/CustomNPCs-Unofficial-Fabric-1.20.1.20251214.jar')
	modImplementation files('libs/architectury-9.2.14-fabric.jar')
	modImplementation files('libs/SmartBrainLib-fabric-1.20.1-1.15.jar')
	modImplementation files('libs/quantified api-omni-2.2.3.jar')
	include implementation('com.github.ben-manes.caffeine:caffeine:3.1.8')
	modCompileOnly files('libs/TACZ-Refabricated-1.20.1-0.5.1-forge1.1.7-hotfix2.jar')

	// Cardinal Components API for capability translation
	include(modImplementation("dev.onyxstudios.cardinal-components-api:cardinal-components-base:${project.cca_version}"))
	include(modImplementation("dev.onyxstudios.cardinal-components-api:cardinal-components-entity:${project.cca_version}"))
	include(modImplementation("dev.onyxstudios.cardinal-components-api:cardinal-components-world:${project.cca_version}"))
	testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

test {
	useJUnitPlatform()
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
